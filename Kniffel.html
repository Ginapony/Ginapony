<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kniffel</title>

<link rel="stylesheet" href="kniffel.css">
</head>

<body>

<div id="menu">

    <h1>Spielmodus wählen</h1>

    <button onclick="chooseMode('pvp')">
        Spieler vs Spieler
    </button>

    <button onclick="chooseMode('pve')">
        Spieler vs Computer
    </button>

    <div id="nameSection" style="display:none;">

        <h2>Namen eingeben</h2>

        <input
            id="p1Name"
            type="text"
            placeholder="Spieler 1 Name"
        >

        <input
            id="p2Name"
            type="text"
            placeholder="Spieler 2 Name"
        >

        <button onclick="startGame()">
            Spiel starten
        </button>

    </div>

</div>

<div id="game" style="display:none;">

    <div id="left">

        <h2>
            <span id="playerTurnName">
                Spieler 1
            </span>
            ist dran
        </h2>

        <table id="scoreTable">

            <thead>

                <tr>
                    <th>Feld</th>

                    <th id="p1Header">
                        Spieler 1
                    </th>

                    <th id="p2Header">
                        Spieler 2
                    </th>
                </tr>

            </thead>

            <tbody></tbody>

        </table>

    </div>

    <div id="right">

        <div id="keptDice"></div>

        <div id="rollBox"></div>

        <button id="rollBtn">
            Würfeln (3)
        </button>

    </div>

</div>

<script>

/* ========================= */
/* DATA */
/* ========================= */

const categories = [

"Einer","Zweier","Dreier",
"Vierer","Fünfer","Sechser",

"Dreierpasch","Viererpasch",
"Full House",

"Kleine Straße",
"Große Straße",

"Kniffel",
"Chance"
];

const upperCategories = [

"Einer","Zweier","Dreier",
"Vierer","Fünfer","Sechser"
];

let players = [
    {scores:{}},
    {scores:{}}
];

let playerNames = [
    "Spieler 1",
    "Spieler 2"
];

let currentPlayer = 0;

let dice = [1,1,1,1,1];

let kept = [
    false,false,false,false,false
];

let rollsLeft = 3;

let hasRolled = false;

let mode = "pvp";

let botRolling = false;

/* ========================= */
/* ELEMENTS */
/* ========================= */

const rollBox =
document.getElementById("rollBox");

const keptBox =
document.getElementById("keptDice");

const rollBtn =
document.getElementById("rollBtn");

const tableBody =
document.querySelector(
"#scoreTable tbody"
);

const playerTurnName =
document.getElementById(
"playerTurnName"
);

/* ========================= */
/* HELPERS */
/* ========================= */

function sleep(ms){

    return new Promise(
        r=>setTimeout(r,ms)
    );
}

/* ========================= */
/* MODE */
/* ========================= */

function chooseMode(m){

    mode = m;

    document.getElementById(
    "nameSection"
    ).style.display = "block";

    if(mode === "pve"){

        document.getElementById(
        "p2Name"
        ).style.display = "none";

    } else {

        document.getElementById(
        "p2Name"
        ).style.display = "block";
    }
}

/* ========================= */
/* START */
/* ========================= */

function startGame(){

    const p1 =
    document.getElementById(
    "p1Name"
    ).value || "Spieler 1";

    let p2 =
    document.getElementById(
    "p2Name"
    ).value || "Spieler 2";

    if(mode === "pve"){
        p2 = "Computer";
    }

    playerNames = [p1,p2];

    document.getElementById(
    "p1Header"
    ).textContent = playerNames[0];

    document.getElementById(
    "p2Header"
    ).textContent = playerNames[1];

    updateTurnDisplay();

    document.getElementById(
    "menu"
    ).style.display = "none";

    document.getElementById(
    "game"
    ).style.display = "flex";

    drawDice();

    drawTable();

    updateRollButton();
}

/* ========================= */
/* TURN TEXT */
/* ========================= */

function updateTurnDisplay(){

    playerTurnName.textContent =
    playerNames[currentPlayer];
}

/* ========================= */
/* BUTTON */
/* ========================= */

function updateRollButton(){

    if(rollsLeft <= 0){

        rollBtn.textContent =
        "Keine Würfe";

        rollBtn.disabled = true;

    } else {

        rollBtn.textContent =
        `Würfeln (${rollsLeft})`;

        rollBtn.disabled = false;
    }
}

/* ========================= */
/* PLAYER ROLL */
/* ========================= */

rollBtn.onclick = async ()=>{

    if(rollsLeft === 0) return;

    if(botRolling) return;

    if(
        mode === "pve"
        &&
        currentPlayer === 1
    ) return;

    hasRolled = true;

    const start = Date.now();

    while(Date.now() - start < 1200){

        dice = dice.map((v,i)=>

            kept[i]
            ? v
            : Math.floor(
                Math.random()*6
            )+1
        );

        drawDice(true);

        await sleep(60);
    }

    dice = dice.map((v,i)=>

        kept[i]
        ? v
        : Math.floor(
            Math.random()*6
        )+1
    );

    drawDice(false);

    rollsLeft--;

    updateRollButton();

    drawTable();
};

/* ========================= */
/* DICE */
/* ========================= */

function createDiceFace(value){

    const d =
    document.createElement("div");

    d.className = "die";

    for(let i=1;i<=value;i++){

        const dot =
        document.createElement("div");

        dot.className =
        "dot d"+value+"-"+i;

        d.appendChild(dot);
    }

    return d;
}

function drawDice(rolling=false){

    rollBox.innerHTML = "";

    keptBox.innerHTML = "";

    dice.forEach((v,i)=>{

        const d =
        createDiceFace(v);

        if(rolling && !kept[i]){
            d.classList.add("rolling");
        }

        if(

            hasRolled &&
            !botRolling &&
            !(

                mode === "pve"
                &&
                currentPlayer === 1
            )

        ){

            d.onclick = ()=>{

                kept[i] = !kept[i];

                drawDice();
            };
        }

        (
            kept[i]
            ? keptBox
            : rollBox

        ).appendChild(d);
    });
}

/* ========================= */
/* TOTAL */
/* ========================= */

function upperSectionTotal(player){

    let total = 0;

    upperCategories.forEach(cat=>{

        total +=
        player.scores[cat] || 0;
    });

    return total;
}

function totalScore(player){

    let total = 0;

    categories.forEach(cat=>{

        total +=
        player.scores[cat] || 0;
    });

    if(upperSectionTotal(player) >= 63){
        total += 35;
    }

    return total;
}

/* ========================= */
/* TABLE */
/* ========================= */

function drawTable(){

    tableBody.innerHTML = "";

    categories.forEach(cat=>{

        const tr =
        document.createElement("tr");

        tr.innerHTML =
        `<td>${cat}</td>`;

        players.forEach((p,pi)=>{

            const td =
            document.createElement("td");

            if(p.scores[cat] != null){

                td.textContent =
                p.scores[cat];

                td.classList.add("used");

            } else if(

                pi === currentPlayer
                &&
                hasRolled
                &&
                !(

                    mode === "pve"
                    &&
                    currentPlayer === 1
                )

            ){

                td.textContent =
                calculate(cat);

                td.onclick = ()=>{

                    if(botRolling)
                    return;

                    p.scores[cat] =
                    calculate(cat);

                    endTurn();
                };

            } else {

                td.textContent = "-";
            }

            tr.appendChild(td);
        });

        tableBody.appendChild(tr);
    });

    /* BONUS */

    const bonusTr =
    document.createElement("tr");

    bonusTr.classList.add(
    "bonusRow"
    );

    bonusTr.innerHTML =
    `<td>Bonus</td>`;

    players.forEach(p=>{

        const td =
        document.createElement("td");

        td.textContent =
        upperSectionTotal(p) >= 63
        ? 35
        : "-";

        bonusTr.appendChild(td);
    });

    tableBody.appendChild(bonusTr);

    /* TOTAL */

    const totalTr =
    document.createElement("tr");

    totalTr.classList.add(
    "totalRow"
    );

    totalTr.innerHTML =
    `<td>Total</td>`;

    players.forEach(p=>{

        const td =
        document.createElement("td");

        td.textContent =
        totalScore(p);

        totalTr.appendChild(td);
    });

    tableBody.appendChild(totalTr);
}

/* ========================= */
/* SCORE */
/* ========================= */

function calculate(cat){

    const sum =
    dice.reduce((a,b)=>a+b,0);

    const counts =
    [1,2,3,4,5,6].map(

        n=>dice.filter(
            d=>d===n
        ).length
    );

    const count = n=>

        dice.filter(
            d=>d===n
        ).length*n;

    if(cat==="Einer")
    return count(1);

    if(cat==="Zweier")
    return count(2);

    if(cat==="Dreier")
    return count(3);

    if(cat==="Vierer")
    return count(4);

    if(cat==="Fünfer")
    return count(5);

    if(cat==="Sechser")
    return count(6);

    if(cat==="Dreierpasch")
    return counts.some(c=>c>=3)
    ? sum : 0;

    if(cat==="Viererpasch")
    return counts.some(c=>c>=4)
    ? sum : 0;

    if(cat==="Full House")
    return counts.includes(3)
    &&
    counts.includes(2)
    ? 25 : 0;

    if(cat==="Kleine Straße")
    return straight(4)
    ? 30 : 0;

    if(cat==="Große Straße")
    return straight(5)
    ? 40 : 0;

    if(cat==="Kniffel")
    return counts.includes(5)
    ? 50 : 0;

    if(cat==="Chance")
    return sum;
}

function straight(len){

    const u =
    [...new Set(dice)].sort();

    let c=1,m=1;

    for(let i=1;i<u.length;i++){

        u[i]===u[i-1]+1
        ? c++
        : c=1;

        m=Math.max(m,c);
    }

    return m>=len;
}

/* ========================= */
/* END TURN */
/* ========================= */

function endTurn(){

    currentPlayer =
    1-currentPlayer;

    updateTurnDisplay();

    dice = [1,1,1,1,1];

    kept = [
        false,false,false,false,false
    ];

    rollsLeft = 3;

    hasRolled = false;

    drawDice();

    drawTable();

    updateRollButton();

    if(

        mode==="pve"
        &&
        currentPlayer===1

    ){

        setTimeout(botTurn,500);
    }
}

/* ========================= */
/* BOT */
/* ========================= */

function getCounts(){

    return [1,2,3,4,5,6].map(

        n=>dice.filter(
            d=>d===n
        ).length
    );
}

function keepNumbers(numbers){

    kept =
    dice.map(v=>

        numbers.includes(v)
    );
}

function botChooseKeep(){

    kept = [
        false,false,false,false,false
    ];

    const counts = getCounts();

    const unique =
    [...new Set(dice)].sort();

    const bestNum =
    counts.indexOf(
        Math.max(...counts)
    )+1;

    if(

        [1,2,3,4].every(
            n=>unique.includes(n)
        )

        ||

        [2,3,4,5].every(
            n=>unique.includes(n)
        )

        ||

        [3,4,5,6].every(
            n=>unique.includes(n)
        )

    ){

        keepNumbers(unique);

        return;
    }

    if(

        counts.includes(3)
        &&
        counts.includes(2)

    ){

        kept = [
            true,true,true,
            true,true
        ];

        return;
    }

    if(counts.some(c=>c>=3)){

        keepNumbers([bestNum]);

        return;
    }

    if(bestNum >= 4){

        keepNumbers([bestNum]);

        return;
    }

    keepNumbers(unique);
}

function chooseBestCategory(){

    let bestCat = null;

    let bestValue = -999;

    for(const cat of categories){

        if(
            players[1].scores[cat]
            != null
        ) continue;

        const score =
        calculate(cat);

        let value = score;

        if(cat==="Kniffel")
        value += 30;

        if(cat==="Große Straße")
        value += 20;

        if(cat==="Kleine Straße")
        value += 15;

        if(cat==="Viererpasch")
        value += 12;

        if(cat==="Full House")
        value += 10;

        if(score===0)
        value -= 20;

        if(value > bestValue){

            bestValue = value;

            bestCat = cat;
        }
    }

    return bestCat;
}

async function botTurn(){

    botRolling = true;

    hasRolled = true;

    kept = [
        false,false,false,false,false
    ];

    rollsLeft = 3;

    updateRollButton();

    await sleep(
        400 + Math.random()*500
    );

    const totalRolls =

    Math.random() < 0.75
    ? 3
    : 2;

    for(let r=0;r<totalRolls;r++){

        const start = Date.now();

        while(Date.now() - start < 850){

            dice = dice.map((v,i)=>

                kept[i]
                ? v
                : Math.floor(
                    Math.random()*6
                )+1
            );

            drawDice(true);

            await sleep(50);
        }

        dice = dice.map((v,i)=>

            kept[i]
            ? v
            : Math.floor(
                Math.random()*6
            )+1
        );

        drawDice(false);

        drawTable();

        await sleep(
            250 + Math.random()*350
        );

        if(r < totalRolls-1){

            botChooseKeep();

            drawDice(false);

            await sleep(
                250 + Math.random()*250
            );
        }

        rollsLeft--;

        updateRollButton();
    }

    let bestCat =
    chooseBestCategory();

    await sleep(
        400 + Math.random()*400
    );

    players[1].scores[bestCat] =
    calculate(bestCat);

    drawTable();

    await sleep(500);

    botRolling = false;

    endTurn();
}

</script>

</body>
</html>
