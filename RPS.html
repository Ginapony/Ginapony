<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="RPS.css">
  <img src="Gini slots.png" alt="Logo" class="logo">
</head>
<body>
  <h1>Rock Paper Scissors</h1>

    <a href="startseite.html">
    <img src="Gini slots.png" alt="Gini Slots" class="logo">
  </a>
  
  <div class="choices">
    <button onclick="play('rock')">🪨</button>
    <button onclick="play('paper')">📄</button>
    <button onclick="play('scissors')">✂️</button>
  </div>
  
  <div id="result"></div>
  
  <div id="scoreboard">
    Wins: <span id="wins">0</span> | 
    Losses: <span id="losses">0</span> | 
    Ties: <span id="ties">0</span>
  </div>

  <script>
    let wins = 0;
    let losses = 0;
    let ties = 0;

    function play(playerChoice) {
      const choices = ['rock', 'paper', 'scissors'];
      const computerChoice = choices[Math.floor(Math.random() * 3)];
      let result = '';

      if (playerChoice === computerChoice) {
        result = `It's a tie! You both chose ${playerChoice}.`;
        ties++;
      } else if (
        (playerChoice === 'rock' && computerChoice === 'scissors') ||
        (playerChoice === 'paper' && computerChoice === 'rock') ||
        (playerChoice === 'scissors' && computerChoice === 'paper')
      ) {
        result = `You win! ${playerChoice} beats ${computerChoice}.`;
        wins++;
      } else {
        result = `You lose! ${computerChoice} beats ${playerChoice}.`;
        losses++;
      }

      document.getElementById('result').textContent = result;
      document.getElementById('wins').textContent = wins;
      document.getElementById('losses').textContent = losses;
      document.getElementById('ties').textContent = ties;
    }
  </script>
</body>
</html>
