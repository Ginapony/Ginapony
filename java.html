<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="Random.css">
<title>Gini Slots</title>
</head>
<body>

<header>
  <a href="startseite.html">
    <img src="Gini slots.png" alt="Gini Slots" class="logo">
  </a>
</header>

<!-- Slots Container -->
<div id="slots-container">
    <div class="slot">
        <img id="slot1" src="placeholder.jpg" alt="Slot 1">
    </div>
    <div class="slot">
        <img id="slot2" src="placeholder.jpg" alt="Slot 2">
    </div>
    <div class="slot">
        <img id="slot3" src="placeholder.jpg" alt="Slot 3">
    </div>
</div>

<!-- Start Button -->
<button id="start-button">Start</button>

<!-- Reset Balance Button -->
<button id="reset-balance-button">Reset Balance</button>

<!-- Balance -->
<div id="balance"></div>
<div id="message"></div>

<!-- JavaScript -->
<script>
    const accessCode = "8471"; // Password for resetting balance
    let balance = parseInt(localStorage.getItem("balance")) || 1000;
    const spinCost = 10;

    const button = document.getElementById('start-button');
    const resetButton = document.getElementById('reset-balance-button');
    const balanceDisplay = document.getElementById('balance');
    const messageDisplay = document.getElementById('message');

    // Display balance on page load
    balanceDisplay.textContent = `💰 Balance: ${balance}`;

    function getRandomImage() {
        const rand = Math.floor(Math.random() * 100) + 1;
        if (rand <= 40) return 'bell.jpg';
        else if (rand <= 60) return 'lemon.jpg';
        else if (rand <= 75) return 'cherry.jpg';
        else if (rand <= 90) return 'watermelon2.jpg';
        else return 'star1.jpg';
    }

    function updateBalance(amount) {
        balance += amount;

        // Auto reset if user goes broke
        if(balance <= 0){
            balance = 1000;
            alert("💸 You're broke! Reloading your balance to 1000.");
        }

        localStorage.setItem("balance", balance);
        balanceDisplay.textContent = `💰 Balance: ${balance}`;
    }

    function checkWin(symbols) {
        let payout = 0;

        if(symbols[0] === symbols[1] && symbols[1] === symbols[2]) {
            switch(symbols[0]){
                case 'bell.jpg': payout = 50; break;
                case 'lemon.jpg': payout = 100; break;
                case 'cherry.jpg': payout = 200; break;
                case 'watermelon2.jpg': payout = 500; break;
                case 'star1.jpg': payout = 1000000; break;
            }
            messageDisplay.textContent = `Jackpot! You won ${payout}!`;
        } else {
            messageDisplay.textContent = `No win. Try again!`;
        }

        updateBalance(payout);
    }

    // Spin slots
    button.addEventListener('click', () => {
        if(balance < spinCost){
            messageDisplay.textContent = "⚠️ Not enough money!";
            return;
        }

        updateBalance(-spinCost);

        const slots = [
            document.getElementById('slot1'),
            document.getElementById('slot2'),
            document.getElementById('slot3')
        ];

        const spinDuration = 1500;
        const intervalSpeed = 75;
        const spinningIntervals = [];

        slots.forEach(slot => {
            const interval = setInterval(() => {
                slot.src = getRandomImage();
            }, intervalSpeed);
            spinningIntervals.push(interval);
        });

        setTimeout(() => {
            spinningIntervals.forEach(interval => clearInterval(interval));
            const finalSymbols = [];
            slots.forEach(slot => {
                const result = getRandomImage();
                slot.src = result;
                finalSymbols.push(result);
            });

            checkWin(finalSymbols);
        }, spinDuration);
    });

    // Reset balance button
    resetButton.addEventListener('click', () => {
        const userCode = prompt("🔒 Enter the access code to reset balance:");
        if(userCode === accessCode){
            balance = 1000;
            localStorage.setItem("balance", balance);
            balanceDisplay.textContent = `💰 Balance: ${balance}`;
            alert("✅ Balance reset to 1000!");
        } else {
            alert("❌ Wrong code! Balance not reset.");
        }
    });

</script>

</body>
</html>
